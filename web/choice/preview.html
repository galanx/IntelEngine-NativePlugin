<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntelEngine choice box preview</title>
<style>
  /* Tokens copied from web/dashboard/src/styles/dashboard.css:5-11 (+ Tailwind default palette used by the dashboard) */
  :root {
    --bg-panel: rgba(15, 15, 20, 0.92);
    --bg-slot: rgba(30, 30, 40, 0.9);
    --bg-slot-hover: rgba(40, 40, 55, 0.95);
    --border-color: rgba(100, 100, 120, 0.3);
    --gray-200: #e5e7eb; --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563;
    --blue-300: #93c5fd; --blue-400: #60a5fa; --blue-500: 59, 130, 246;
    --red-300: #fca5a5; --red-400: #f87171; --red-700: 185, 28, 28; --red-900: 127, 29, 29;
    --yellow-400: #facc15;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: var(--gray-200); }
  /* fake game backdrop */
  body { min-height: 100vh; background: radial-gradient(ellipse at 30% 20%, #3b4a3a 0%, #1d2a2e 40%, #0a0d12 100%); }
  .tabs { display: flex; gap: 6px; justify-content: center; padding: 14px; flex-wrap: wrap; }
  .tab { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 4px; border: 1px solid transparent; cursor: pointer;
         background: rgba(255,255,255,.05); color: var(--gray-400); transition: background .15s, color .15s; }
  .tab:hover { color: var(--gray-200); background: rgba(255,255,255,.1); }
  .tab.on { background: rgba(var(--blue-500), .3); color: var(--blue-300); border-color: rgba(var(--blue-500), .5); }
  .stage { display: flex; justify-content: center; padding: 6vh 16px; }

  /* .dashboard-panel (dashboard.css:17-21) + rounded-lg + header row of App.jsx:145-153 */
  .panel { width: 380px; max-width: 100%; background: var(--bg-panel); border: 1px solid var(--border-color);
           backdrop-filter: blur(12px); border-radius: 8px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,.1); }
  .head h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--gray-200); text-transform: uppercase; letter-spacing: .05em; }
  .head .tag { font-size: 12px; color: var(--gray-500); }
  .body { padding: 12px 16px 14px; }
  /* .section-header (dashboard.css:32-34) */
  .kind { font-size: 11px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  /* .slot-card (dashboard.css:23-27) holds the prompt text */
  .prompt { background: var(--bg-slot); border: 1px solid var(--border-color); border-radius: 4px; padding: 8px 12px;
            font-size: 14px; line-height: 1.4; color: var(--gray-200); }
  .prompt small { display: block; margin-top: 4px; font-size: 12px; color: var(--gray-400); }
  .timer { height: 4px; margin-top: 10px; border-radius: 2px; background: rgba(100,100,120,.25); overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--blue-400); transform-origin: left; }
  .timer-label { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--gray-500); }
  .btns { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  /* button styles copied from DirectorTab.jsx:756 (primary), SettingsTab.jsx:616 (selected), PackagesTab.jsx:43 (danger) */
  .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 6px 12px; font: inherit; font-size: 12px;
         font-weight: 500; border: 1px solid transparent; border-radius: 4px; cursor: pointer; transition: background .15s; }
  .btn kbd { font: 10px ui-monospace, Consolas, monospace; color: var(--gray-500); border: 1px solid var(--border-color); border-radius: 3px; padding: 0 5px; }
  .btn.primary { background: rgba(var(--blue-500), .2); color: var(--blue-400); }
  .btn.primary:hover { background: rgba(var(--blue-500), .3); }
  .btn.neutral { background: rgba(255,255,255,.05); color: var(--gray-400); border-color: var(--border-color); }
  .btn.neutral:hover { background: rgba(255,255,255,.1); color: var(--gray-200); }
  .btn.danger { background: rgba(var(--red-900), .4); color: var(--red-300); border-color: rgba(var(--red-700), .3); }
  .btn.danger:hover { background: rgba(var(--red-900), .6); }
  .foot { display: flex; justify-content: space-between; margin-top: 10px; font-size: 10px; color: var(--gray-600); }
  .picked { min-height: 14px; color: var(--yellow-400); }
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div class="stage"><div class="panel" id="card"></div></div>
<script>
// Texts from Source/Scripts: StoryEngine.psc:3703/3705 (quest), :1812 (knock), Core.psc:1166 (permission).
// tone: p = primary, n = neutral, d = danger
const BOXES = [
  { tab: 'Quest (3)', title: 'Brynjolf', kind: 'Quest offer',
    text: 'Brynjolf tells you about trouble near Bleak Falls Barrow.',
    btns: [['Lead the way', 'p'], ["I'll go alone", 'n'], ['Not interested', 'd']] },
  { tab: 'Quest (2)', title: 'Lydia', kind: 'Quest offer',
    text: 'Lydia pleads for help rescuing Dravynea near Shimmermist Cave.',
    btns: [["I'll check it out", 'p'], ['Not interested', 'd']] },
  { tab: 'Door knock', title: 'Farengar Secret-Fire', kind: 'At the door', timeout: 30,
    text: 'Farengar Secret-Fire is knocking at your door.',
    btns: [['Let them in', 'p'], ['Send them away', 'n'], ['Ignore', 'd']] },
  { tab: 'Permission', title: 'Ysolda', kind: 'Task permission',
    text: 'Ysolda wants to travel to Whiterun Stables.',
    btns: [['Allow', 'p'], ['Deny', 'n'], ['Deny (Silent)', 'd']] },
];
let timer, cur = 0;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function show(i) {
  cur = i; clearInterval(timer);
  const b = BOXES[i];
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('on', j === i));
  $('card').innerHTML = `
    <div class="head"><h1>${esc(b.title)}</h1><span class="tag">IntelEngine</span></div>
    <div class="body">
      <div class="kind">${esc(b.kind)}</div>
      <div class="prompt">${esc(b.text)}${b.sub ? `<small>${esc(b.sub)}</small>` : ''}</div>
      ${b.timeout ? `<div class="timer"><i id="bar"></i></div><div class="timer-label"><span>No answer = Ignore</span><span id="secs">${b.timeout} s</span></div>` : ''}
      <div class="btns">${b.btns.map((x, k) => `<button class="btn ${{p:'primary',n:'neutral',d:'danger'}[x[1]]}" data-i="${k}"><span>${esc(x[0])}</span><kbd>${k + 1}</kbd></button>`).join('')}</div>
      <div class="foot"><span class="picked" id="picked"></span><span>1-${b.btns.length} choose &middot; Esc = no answer</span></div>
    </div>`;
  $('card').querySelectorAll('.btn').forEach(el => el.onclick = () => pick(+el.dataset.i));
  if (b.timeout) {
    let left = b.timeout; const t0 = Date.now();
    timer = setInterval(() => {
      left = Math.max(0, b.timeout - (Date.now() - t0) / 1000);
      $('bar').style.transform = `scaleX(${left / b.timeout})`;
      $('secs').textContent = Math.ceil(left) + ' s';
      if (left <= 0) { clearInterval(timer); $('picked').textContent = 'answered: -1 (timeout)'; }
    }, 100);
  }
}
function pick(k) { clearInterval(timer); $('picked').textContent = `answered: index ${k} (${BOXES[cur].btns[k][0]})`; }

BOXES.forEach((b, i) => { const t = document.createElement('button'); t.className = 'tab'; t.textContent = b.tab; t.onclick = () => show(i); $('tabs').append(t); });
addEventListener('keydown', e => {
  const n = +e.key;
  if (n >= 1 && n <= BOXES[cur].btns.length) pick(n - 1);
  else if (e.key === 'Escape') { clearInterval(timer); $('picked').textContent = 'answered: -1 (Esc)'; }
});
show(0);
</script>
</body>
</html>
