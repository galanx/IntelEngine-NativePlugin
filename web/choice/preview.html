<!DOCTYPE html>
<html lang="en">
<!--
  Browser preview of the IntelEngine choice page (dev only). Serve the repo root:
    python -m http.server 8174
  Open http://localhost:8174/web/choice/preview.html
  The real page runs in the frame; a fake window.ieChoice stands in for Magelight and logs what Papyrus would receive.
-->
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IntelEngine choice box preview</title>
<style>
  body { margin: 0; font: 14px 'Segoe UI', system-ui, sans-serif; background: #222; color: #ddd; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #111; }
  .tab { font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; background: rgba(255,255,255,.05); color: #9ca3af; }
  .tab:hover { color: #e5e7eb; background: rgba(255,255,255,.1); }
  #stage { position: relative; height: 70vh; background: radial-gradient(ellipse at 30% 20%, #3b4a3a 0%, #1d2a2e 40%, #0a0d12 100%); }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #log { margin: 0; padding: 8px 12px; height: calc(30vh - 52px); overflow: auto; background: #000; color: #9f9; }
</style>
</head>
<body>
<div class="tabs" id="tabs"></div>
<div id="stage"><iframe id="page" title="IntelEngine choice page" src="index.html"></iframe></div>
<pre id="log"></pre>
<script>
// Texts from Source/Scripts: StoryEngine.psc (quest prompts, knock), Core.psc (permission); same buttons as the call sites.
const BOXES = [
  { tab: 'Quest (3)', title: 'Brynjolf', kind: 'Quest offer',
    body: 'Brynjolf tells you about trouble near Bleak Falls Barrow.', buttons: ['Lead the way', "I'll go alone", 'Not interested'] },
  { tab: 'Quest (2)', title: 'Lydia', kind: 'Quest offer',
    body: 'Lydia pleads for help rescuing Dravynea near Shimmermist Cave.', buttons: ["I'll check it out", 'Not interested'] },
  { tab: 'Door knock', title: 'Farengar Secret-Fire', kind: 'At the door', timeoutMs: 30000,
    body: 'Farengar Secret-Fire is knocking at your door.', buttons: ['Let them in', 'Send them away', 'Ignore'] },
  { tab: 'Permission', title: 'Ysolda', kind: 'Task permission',
    body: 'Ysolda wants to travel to Whiterun Stables.', buttons: ['Allow', 'Deny', 'Deny (Silent)'] },
];
const frame = document.getElementById('page');
const log = msg => { document.getElementById('log').textContent += msg + '\n'; };
let n = 0, cur = BOXES[0];

function show(i) {
  cur = BOXES[i];
  document.querySelectorAll('.tab').forEach((t, j) => t.style.outline = j === i ? '1px solid #60a5fa' : '');
  const payload = JSON.stringify({ token: 'r' + (++n), title: cur.title, kind: cur.kind, body: cur.body, buttons: cur.buttons, timeoutMs: cur.timeoutMs || 0 });
  log(`Magelight.Call(view, "ieChoiceShow", '${payload}')`);
  frame.contentWindow.ieChoiceShow(payload);
  frame.focus();
}

frame.addEventListener('load', () => {
  try {
    frame.contentWindow.ieChoice = msg => {
      const a = msg.split('|')[1];
      const label = a === 't' ? 'TIMED_OUT' : (cur.buttons[+a] || '?');
      log(`ieChoice("${msg}")  ->  Papyrus returns "${label}"`);
    };
    log('page loaded; fake Magelight bridge attached');
    show(0);
  } catch (e) {
    log('Cannot reach the page frame. Serve over HTTP (python -m http.server 8174), not file://');
  }
});
BOXES.forEach((b, i) => {
  const t = document.createElement('button');
  t.className = 'tab'; t.textContent = b.tab; t.onclick = () => show(i);
  document.getElementById('tabs').append(t);
});
</script>
</body>
</html>
